name: Deploy Lernspiel (GitHub Pages)

on:
  push:
    branches: [ main, feature/learning-game ]
    paths:
      - 'game/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload game/ as artifact
        run: |
          # game/ ist die statische Site (index.html, style.css, app.js, Kapitel)
          mkdir -p public
          cp -r game/. public/
          # Relative Pfade bleiben korrekt, weil alles in game/ flach liegt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
